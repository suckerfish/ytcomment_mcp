version: '3.8'

services:
  ytcomment-mcp:
    image: ghcr.io/suckerfish/ytcomment_mcp:latest
    pull_policy: always
    # Uncomment below for local development
    # build: 
    #   context: .
    #   dockerfile: Dockerfile
    container_name: ytcomment-mcp
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - PORT=${PORT:-8080}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-X", "POST", "http://localhost:8080/mcp/", 
             "-H", "Content-Type: application/json",
             "-H", "Accept: application/json, text/event-stream",
             "-d", '{"jsonrpc":"2.0","method":"tools/call","id":"health","params":{"name":"health_check","arguments":{}}}']
      interval: 30s
      timeout: 10s
      retries: 3