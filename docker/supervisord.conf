[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ytcomment-mcp-http]
command=uv run python src/server.py --transport streamable-http --host 0.0.0.0 --port 8080
directory=/app
stdout_logfile=/var/log/supervisor/mcp-http.log
stderr_logfile=/var/log/supervisor/mcp-http.log
autorestart=true
user=root

[program:ytcomment-mcp-stdio]
command=uv run python src/server.py --transport stdio
directory=/app
stdout_logfile=/var/log/supervisor/mcp-stdio.log
stderr_logfile=/var/log/supervisor/mcp-stdio.log
autorestart=true
user=root

[program:metamcp]
command=metamcp --config /config/metamcp-config.json
directory=/app
stdout_logfile=/var/log/supervisor/metamcp.log
stderr_logfile=/var/log/supervisor/metamcp.log
autorestart=true
user=root