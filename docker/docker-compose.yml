version: '3.8'

services:
  ytcomment-mcp:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ytcomment-mcp-server
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    volumes:
      - ..:/app
    restart: unless-stopped

  metamcp:
    image: metamcp:latest  # Replace with actual MetaMCP image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Access to Docker socket
      - ./metamcp-config.json:/config/config.json
    depends_on:
      - ytcomment-mcp
    restart: unless-stopped