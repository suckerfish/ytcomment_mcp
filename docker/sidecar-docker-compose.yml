version: '3.8'

services:
  mcp-services:
    build: 
      context: ..
      dockerfile: docker/SidecarDockerfile
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    volumes:
      - ..:/app
      - mcp-config:/config
    ports:
      - "8080:8080"  # HTTP endpoint for external access
    restart: unless-stopped

volumes:
  mcp-config: