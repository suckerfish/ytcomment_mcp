version: '3.8'

services:
  ytcomment-mcp:
    build: 
      context: ..
      dockerfile: docker/SimpleDockerfile
    container_name: ytcomment-mcp
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - PORT=${PORT:-8080}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3